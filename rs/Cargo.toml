[package]
name = "rpi"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-executor = { version = "0.10.0", features = [
  "platform-cortex-m",
  "executor-thread",
] }
embassy-rp = { version = "0.10.0", features = [
  "rp2040",
  "time-driver",
  "critical-section-impl",
] }
embassy-time = "0.5.1"
cortex-m-rt = "0.7.7"
panic-halt = "1.0.0"
embassy-usb-logger = "0.6.0"
log = "0.4.34"
embassy-sync = "0.8.0"
